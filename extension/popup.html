<!doctype html>
<html><head>
<meta charset="utf-8" />
<title>TruthLens</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">
      <span class="badge"></span>
      <strong>TRUTHLENS</strong>
      <em>v1.0</em>
    </div>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="text">TEXT</button>
    <button class="tab" data-tab="url">URL</button>
  </div>
  <section data-pane="text" class="pane active">
    <textarea id="text" placeholder="Paste text to scan…"></textarea>
    <button id="run-text">ANALYZE</button>
  </section>
  <section data-pane="url" class="pane">
    <input id="url" type="text" placeholder="https://example.com/article" />
    <button id="run-url">ANALYZE</button>
  </section>
  <div id="result"></div>
  <footer>
    <a href="#" id="open-options">settings</a>
    <span>· right-click images / pages on any site to scan in-place</span>
  </footer>
  <script src="popup.js"></script>
</body></html>
